services:
  mock-streaming:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app:ro
    command: ["python", "mock_streaming_service.py", "--host", "127.0.0.1", "--port", "3000"]
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
