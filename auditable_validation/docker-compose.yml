services:
  target:
    image: ${TARGET_IMAGE:-python:3.12-slim}
    working_dir: /app
    volumes:
      - ../sandbox_target:/app:ro
    command: ["python", "mock_streaming_service.py", "--host", "0.0.0.0", "--port", "3000"]
    expose: ["3000"]
    networks: [isolated]
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  authorization-worker:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app:ro
      - type: tmpfs
        target: /dev/shm/fuzzer_runtime
        tmpfs:
          size: 67108864
          mode: 0700
      - ../logs:/logs
    environment:
      TARGET_SCOPE_URL: ${TARGET_SCOPE_URL:-http://target:3000}
      ADMIN_LOGIN_PATH: ${ADMIN_LOGIN_PATH:-/admin/login}
      CREATOR_SETTINGS_PATH: ${CREATOR_SETTINGS_PATH:-/api/v1/creators/creator_test_99/settings}
      TEST_ACCOUNT_ID: ${TEST_ACCOUNT_ID:-creator_test_99}
      RUNTIME_DIR: /dev/shm/fuzzer_runtime
      CAMPAIGN_ID: ${CAMPAIGN_ID:-validation-01}
      AUDIT_PATH: /logs/audit_trail.csv
      REPORT_PATH: /logs/PATCH_ADVISORY.md
    command: ["python", "authorization_adapter.py"]
    depends_on: [target]
    networks: [isolated]
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

networks:
  isolated:
    name: auditable_validation_isolated
    driver: bridge
    internal: true
