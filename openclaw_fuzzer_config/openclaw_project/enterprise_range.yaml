version: 1
contract: bounded-browser-qa
campaign_scope: ../../campaign_scope.json
network:
  policy: loopback-only
  allowed_hosts: [127.0.0.1]
  external_proxies: forbidden
browser:
  automation_disclosed: true
  cdp_evasion_scripts: forbidden
  fingerprint_randomization: forbidden
  viewport: [1440, 900]
execution:
  attempt_budget: 500
  zero_knowledge_phase: login_gate_analysis
  credentialed_phase: authenticated_authorization_checks
  session_storage: memory-only
  boundary_state: APPROVAL_REQUIRED
live_commands:
  allowed: [set_path, set_pacing_ms, snapshot]
  pacing_ms: {minimum: 0, maximum: 15000}
audit:
  append_only_path: ./logs/audit_trail.csv
  budget_alert_path: ./TIMEOUT_ALERT.md
