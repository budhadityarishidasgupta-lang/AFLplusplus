name: Offline UAT security validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: security-company-agent
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run offline unit tests
        run: python -m unittest tests.test_uat_security -v
      - name: Compile Python sources
        run: python -m compileall -q scripts tests
      - name: Run offline security validation
        run: python scripts/uat_security_checks.py
